name: policy_password_depluralizedQ2nR7xVbK4Lm
runtime: yaml
description: >-
  Renamed source for the v7 rename of the auto-pluralized property names.
  Identical to policy_password_depluralized apart from groupsIncluded, and it
  keeps the same project name so it can replace that program in place.
resources:
  oktaGroup:
    type: okta:group:Group
    properties:
      description: A group referenced by a password policy
  oktaPasswordPolicy:
    type: okta:policy:Password
    properties:
      description: An example password policy
      priority: 1
      groupsIncluded:
        - ${oktaGroup.id}
